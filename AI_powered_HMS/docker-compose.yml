services:
  # 1. Apache Zookeeper Coordination Service
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: kaire_health_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 2. Apache Kafka Event Streaming Broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kaire_health_kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_INTERNAL://localhost:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

  # 3. MySQL 8.0 Managed Relational Database
  db:
    image: mysql:8.0
    container_name: kaire_health_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: kaire_health
      MYSQL_USER: kaire_user
      MYSQL_PASSWORD: kaire_password
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 5

  # 4. Flask REST Backend & Kafka Streaming Engine
  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    container_name: kaire_health_server
    restart: always
    environment:
      FLASK_ENV: production
      USE_MYSQL: "true"
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: kaire_user
      MYSQL_PASSWORD: kaire_password
      MYSQL_DB: kaire_health
      JWT_SECRET_KEY: kaire-jwt-production-secret-2026
      SECRET_KEY: kaire-app-production-secret-key
      ENABLE_KAFKA: "true"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_started

  # 5. React + Vite Frontend Client
  client:
    build:
      context: ./client
      dockerfile: ../docker/client.Dockerfile
    container_name: kaire_health_client
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  mysql_data:
