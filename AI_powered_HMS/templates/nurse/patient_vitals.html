{% extends "layout/base.html" %}
{% block content %}

<div class="page-title">📋 Add Patient Vitals</div>

{% if success %}
<div class="alert alert-success">✅ Vitals recorded successfully!</div>
{% endif %}

<div class="predict-form" style="max-width:600px;">
    <h2>Record Vitals</h2>
    <form method="POST" action="/nurse/vitals">

        <div class="form-group">
            <label>Select Patient</label>
            <select name="patient_id" required>
                <option value="">-- Select Patient --</option>
                {% for p in patients %}
                <option value="{{ p.patient_id }}">{{ p.name }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Blood Pressure (mmHg)</label>
                <input type="number" name="bp" placeholder="e.g. 130" required>
            </div>
            <div class="form-group">
                <label>Cholesterol (mg/dl)</label>
                <input type="number" name="chol" placeholder="e.g. 220" required>
            </div>
            <div class="form-group">
                <label>Glucose (mg/dl)</label>
                <input type="number" name="glucose" placeholder="e.g. 140" required>
            </div>
            <div class="form-group">
                <label>Heart Rate (bpm)</label>
                <input type="number" name="heart_rate" placeholder="e.g. 80">
            </div>
            <div class="form-group">
                <label>BMI</label>
                <input type="number" step="0.1" name="bmi" placeholder="e.g. 25.5">
            </div>
        </div>

        <button type="submit" class="btn btn-primary" style="margin-top:1rem;">💾 Save Vitals</button>
    </form>
</div>

{% endblock %}
