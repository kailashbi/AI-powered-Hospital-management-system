{% extends "layout/base.html" %}
{% block content %}

<div style="max-width:420px; margin: 3rem auto;">
    <div class="form-card">
        <h2>📝 Patient Registration</h2>

        <form method="POST" action="/register">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" placeholder="Ramesh Patel" required>
            </div>
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="ramesh@gmail.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Choose a password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>

        <p style="text-align:center;margin-top:1.2rem;font-size:0.88rem;color:#6b7c93;">
            Already have an account? <a href="/login" style="color:#1a6fc4;">Login</a>
        </p>
    </div>
</div>

{% endblock %}
