{% extends "layout/base.html" %}
{% block content %}

<div style="max-width:420px; margin: 3rem auto;">
    <div class="form-card">
        <h2>🔑 Login</h2>

        {% if error %}
        <div class="alert alert-danger">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>Email Address</label>
                <input type="email" name="email" placeholder="you@hospital.com" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <p style="text-align:center;margin-top:1.2rem;font-size:0.88rem;color:#6b7c93;">
            New patient? <a href="/register" style="color:#1a6fc4;">Register here</a>
        </p>
    </div>
</div>

{% endblock %}
